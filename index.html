<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal do Aluno - Senac Minas</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <!-- VLibras: wrapper para posicionamento centralizado vertical no canto direito -->
    <div id="vlibras-container">
      <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
          <div class="vw-plugin-top-wrapper"></div>
        </div>
      </div>
    </div>
    <script>
      window.__loadVLibras = function(callback) {
        if (window.VLibras) {
          try {
            var vw = document.querySelector('[vw]');
            if (vw) new window.VLibras.Widget('https://vlibras.gov.br/app');
            callback && callback(true);
          } catch (e) {
            console.warn('VLibras: inicialização indisponível', e);
            callback && callback(false);
          }
          return;
        }
        var s = document.createElement('script');
        s.src = 'https://vlibras.gov.br/app/vlibras-plugin.js';
        s.async = true;
        s.onload = function() {
          setTimeout(function() {
            try {
              if (window.VLibras) {
                var vw = document.querySelector('[vw]');
                if (vw) new window.VLibras.Widget('https://vlibras.gov.br/app');
              }
              callback && callback(true);
            } catch (e) {
              console.warn('VLibras: inicialização indisponível', e);
              callback && callback(false);
            }
          }, 300);
        };
        s.onerror = function() {
          console.warn('VLibras: script não carregou. O recurso não estará disponível.');
          callback && callback(false);
        };
        document.body.appendChild(s);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
